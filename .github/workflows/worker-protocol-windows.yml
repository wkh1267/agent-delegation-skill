name: Worker Protocol Windows

on:
  push:
    branches:
      - feat/delegent-v0.1
  pull_request:

jobs:
  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run focused protocol diagnostic
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          powershell -NoProfile -ExecutionPolicy Bypass -File .\evals\debug-worker-protocol.ps1
      - name: Run fake-only Worker protocol tests
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\evals\test-worker-protocol.ps1
