name: Worker Protocol Windows

on:
  push:
    branches:
      - feat/delegent-v0.1
  pull_request:

jobs:
  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fake-only Worker protocol tests
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          powershell -NoProfile -ExecutionPolicy Bypass -File .\evals\test-worker-protocol.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\evals\test-terminal-tool-catalog.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\evals\test-terminal-tool-discovery-config.ps1
