name: Worker Protocol Windows

on:
  push:
    branches:
      - feat/delegent-v0.1
  pull_request:

jobs:
  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run focused protocol diagnostic
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          powershell -NoProfile -ExecutionPolicy Bypass -File .\evals\debug-worker-protocol.ps1
      - name: Probe same-scope fake-only tests
        shell: powershell
        run: |
          $source = Get-Content -Raw .\evals\test-worker-protocol.ps1
          $patched = $source.Replace('        & $test.Value', '        . $test.Value')
          if ($patched -ceq $source) { throw 'Same-scope probe replacement did not apply.' }
          Set-Content -LiteralPath .\evals\test-worker-protocol-same-scope.ps1 -Value $patched -Encoding UTF8
          powershell -NoProfile -ExecutionPolicy Bypass -File .\evals\test-worker-protocol-same-scope.ps1
